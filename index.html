<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>成功轉盤</title>
  <style>
    :root { --ink:#24262a; --muted:#777b81; --paper:#faf9f6; --line:#e7e5e0; --dark:#24262a; }
    * { box-sizing:border-box } body { margin:0; min-height:100svh; overflow-x:hidden; color:var(--ink); font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif; background:linear-gradient(135deg,#f7f6f2,#fbfaf8 52%,#f4f3f0); }
    .app { min-height:100svh; display:grid; grid-template-rows:auto 1fr auto; padding:clamp(14px,3vw,30px); }
    header { display:flex; justify-content:space-between; align-items:center; max-width:860px; width:100%; margin:auto; }
    h1 { font-size:clamp(1.15rem,4vw,1.55rem); margin:0; letter-spacing:.06em; color:var(--ink); }
    .manage { border:1px solid var(--line); color:#4c5055; background:#fff; border-radius:10px; min-width:48px; min-height:44px; padding:0 14px; font:inherit; cursor:pointer; }
    main { display:grid; place-items:center; padding:12px 0; }
    .stage { width:min(88vw,660px); aspect-ratio:1; position:relative; display:grid; place-items:center; }
    .pointer { position:absolute; z-index:5; top:-1.6%; left:50%; transform:translateX(-50%); width:0;height:0;border-left:15px solid transparent;border-right:15px solid transparent;border-top:30px solid #24262a; filter:drop-shadow(0 2px 2px #0002); }
    .pointer:after { content:""; position:absolute;width:8px;height:8px;border-radius:50%;background:#faf9f6;top:-26px;left:-4px; }
    .wheel-shell { width:100%; height:100%; padding:clamp(5px,1vw,9px); border-radius:50%; background:#fff; box-shadow:0 14px 28px #20242a18,inset 0 0 0 1px #dedcd6; }
    .wheel { width:100%;height:100%;border-radius:50%;position:relative;overflow:hidden; transform:rotate(0deg); background:#d7d7d3; box-shadow:inset 0 0 0 1px #fff; will-change:transform; }
    .slice-lines { position:absolute;inset:0;border-radius:50%;background:repeating-conic-gradient(from 0deg,transparent 0 calc(var(--slice) - .7deg),#faf9f6dd calc(var(--slice) - .15deg) var(--slice)); pointer-events:none; }
    .name { --a:0deg; --na:0deg; --radius:-120px; position:absolute; left:50%; top:50%; width:34%; text-align:center; font-weight:700; letter-spacing:.02em; font-size:clamp(.76rem,2.7vw,1.2rem); line-height:1.1; color:#303236; text-shadow:0 1px 0 #ffffff99; transform:translate(-50%,-50%) rotate(var(--a)) translateY(var(--radius)) rotate(var(--na)); transform-origin:center; overflow-wrap:anywhere; }
    .center-button { z-index:4; position:absolute; display:grid; place-items:center; width:28%; aspect-ratio:1; border-radius:50%; border:4px solid #fff; background:#24262a; color:#fff; font-size:clamp(1rem,4.5vw,1.55rem); font-weight:800; letter-spacing:.1em; box-shadow:0 7px 16px #1d202633; cursor:pointer; transition:transform .15s,background .2s; }
    .center-button:hover { background:#404349 }.center-button:active { transform:scale(.94); } .center-button.spin-bounce{animation:jelly .32s ease-out}.center-button:disabled { cursor:wait; }
    .empty { position:absolute; z-index:6; text-align:center; font-weight:700; background:#fffffff2; color:#4c5055; padding:20px; border-radius:12px; box-shadow:0 10px 22px #20242a18; }
    footer { text-align:center; font-size:.88rem; color:var(--muted); min-height:25px; } #remaining { color:var(--ink);font-weight:700; }
    .sheet { position:fixed;inset:0;z-index:20;display:none;align-items:end;justify-content:center;background:#92778644;backdrop-filter:blur(5px); } .sheet.open{display:flex}
    .sheet-panel { width:min(100%,560px); max-height:85svh; overflow:auto; padding:22px max(20px,env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left)); border-radius:28px 28px 0 0; background:linear-gradient(145deg,#fffdf9,#f9edf2); box-shadow:0 -8px 32px #a7839140; }
    .sheet-top { display:flex;justify-content:space-between;align-items:center; } h2{margin:0;font-size:1.3rem;color:#836476}.close{background:none;border:0;color:#b27d92;font-size:2rem;line-height:1;cursor:pointer;padding:7px}
    form { display:flex;gap:9px;margin:20px 0 14px; } input { min-width:0; flex:1; font:inherit; color:#725d67;border:1px solid #f3dce4;border-radius:14px;padding:15px; } .add { border:0;border-radius:14px;background:#f7b7ae;color:#fff;font:inherit;font-weight:900;padding:0 16px;cursor:pointer; box-shadow:0 4px 0 #df98a0; }
    .members { list-style:none;margin:0;padding:0;display:grid;gap:8px }.members li { display:flex;align-items:center;gap:8px;padding:10px 10px 10px 15px;border:1px solid #f3e1e6;border-radius:14px;background:#fffdfb; }.member-name{flex:1;font-weight:600;overflow-wrap:anywhere}.mini { min-width:42px;min-height:42px;border:0;border-radius:10px;background:#f5eaf0;color:#8d6f80;font:inherit;cursor:pointer}.mini.delete{color:#d98598}.status{font-size:.82rem;color:#c39b51}.winner { position:fixed;z-index:15;inset:0;display:none;place-items:center;text-align:center;background:radial-gradient(circle,#fff9efdc,#f4dfe9dc 70%);backdrop-filter:blur(4px); }.winner.show{display:grid;animation:fade .25s}.winner-card{padding:36px 22px;max-width:min(88vw,550px);animation:pop .6s cubic-bezier(.2,1.4,.3,1)}.winner-card small{font-size:1.2rem;letter-spacing:.2em;color:#d4949d}.winner-name{font-size:clamp(2.8rem,13vw,6rem);font-weight:900;line-height:1.12;margin:10px 0 26px;color:#8c6479;text-shadow:0 3px 0 #fff,0 0 22px #f4c6d2}.again{border:0;border-radius:999px;padding:16px 28px;font:inherit;font-size:1.1rem;font-weight:900;color:#856373;background:#f9dca1;box-shadow:0 5px 0 #dfbc78;cursor:pointer}.confetti{position:fixed;inset:0;pointer-events:none;z-index:16;overflow:hidden}.confetti i{position:absolute;width:10px;height:17px;background:var(--c);left:var(--x);top:-30px;border-radius:4px;transform:rotate(var(--r));animation:fall var(--d) var(--delay) ease-in forwards}@keyframes fall{to{top:110%;transform:translateX(var(--drift)) rotate(720deg)}}@keyframes pop{from{transform:scale(.35);opacity:0}to{transform:scale(1);opacity:1}}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes jelly{45%{transform:scale(.88)}75%{transform:scale(1.07)}100%{transform:scale(1)}}
    /* Minimal management and winner treatment */
    .sheet{background:#20242a33;backdrop-filter:blur(3px)}.sheet-panel{background:#fdfcf9;box-shadow:0 -8px 32px #20242a1a}.sheet-top h2{color:#24262a}.close{color:#4c5055}input{color:#24262a;border:1px solid #e7e5e0;border-radius:9px}.add{border-radius:9px;background:#24262a;box-shadow:none}.members{display:block}.members li{padding:12px 2px;border:0;border-bottom:1px solid #e7e5e0;border-radius:0;background:transparent}.mini{background:transparent;color:#4c5055;border-radius:7px}.mini:hover{background:#f1f0ed}.mini.delete{color:#8d5959}.status{color:#777b81}.reset{width:100%;margin-top:22px;min-height:46px;border:1px solid #bbbcb9;border-radius:9px;background:transparent;color:#45484c;font:inherit;font-weight:600;cursor:pointer}.winner{background:#faf9f6e8;backdrop-filter:blur(3px)}.winner.show{animation:fade .2s}.winner-card{animation:pop .4s ease-out}.winner-card small{font-size:1rem;letter-spacing:.14em;color:#74787e}.winner-name{color:#24262a;text-shadow:none}.again{border-radius:8px;background:#24262a;color:#fff;box-shadow:none}.confetti i{width:7px;height:12px;border-radius:0}.confirm{position:fixed;z-index:30;inset:0;display:none;place-items:center;padding:20px;background:#20242a33;backdrop-filter:blur(3px)}.confirm.show{display:grid}.confirm-card{width:min(100%,380px);padding:25px;border-radius:14px;background:#fff;box-shadow:0 18px 40px #20242a24}.confirm-card h3{margin:0 0 10px;font-size:1.15rem}.confirm-card p{margin:0;color:#777b81;line-height:1.65;font-size:.92rem}.confirm-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:23px}.confirm-actions button{min-height:42px;border-radius:8px;padding:0 14px;font:inherit;font-weight:600;cursor:pointer}.cancel{border:1px solid #e7e5e0;background:#fff;color:#4c5055}.confirm-reset{border:0;background:#24262a;color:#fff}.toast{position:fixed;z-index:40;bottom:28px;left:50%;transform:translate(-50%,14px);padding:11px 17px;border-radius:8px;background:#24262a;color:#fff;font-size:.9rem;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media (min-width:700px){.stage{width:min(70vh,620px)}.sheet{align-items:center}.sheet-panel{border-radius:14px}.app{padding-bottom:18px}}
  </style>
</head>
<body>
  <div class="app"><header><h1>成功轉盤</h1><button class="manage" id="manage" aria-label="管理成員">☰ 名單</button></header><main><div class="stage"><div class="pointer"></div><div class="wheel-shell"><div class="wheel" id="wheel"><div class="slice-lines" id="lines"></div></div></div><button class="center-button" id="spin">開始</button><div class="empty" id="empty" hidden>名單已抽完<br><small>到「名單」新增成員</small></div></div></main><footer>剩餘 <span id="remaining">0</span> 位成員</footer></div>
  <div class="sheet" id="sheet" aria-hidden="true"><section class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="membersTitle"><div class="sheet-top"><h2 id="membersTitle">成員名單</h2><button class="close" id="close" aria-label="關閉">×</button></div><form id="memberForm"><input id="newName" maxlength="24" placeholder="輸入成員姓名" autocomplete="off" required><button class="add">新增</button></form><ul class="members" id="members"></ul><button class="reset" id="reset">重置轉盤</button></section></div>
  <div class="winner" id="winner"><div class="winner-card"><small>恭喜抽中</small><div class="winner-name" id="winnerName"></div><button class="again" id="again">繼續抽</button></div></div><div class="confetti" id="confetti"></div><div class="confirm" id="confirm"><section class="confirm-card" role="dialog" aria-modal="true" aria-labelledby="confirmTitle"><h3 id="confirmTitle">確定要重置轉盤嗎？</h3><p>所有已抽中的成員都會重新加入轉盤，成員名單不會被刪除。</p><div class="confirm-actions"><button class="cancel" id="cancelReset">取消</button><button class="confirm-reset" id="confirmReset">確定重置</button></div></section></div><div class="toast" id="toast">轉盤已重置</div>
  <script>
    const KEY='success-wheel-demo-v1';
    const defaults=['王小明','陳小美','林志豪','張雅婷','李承翰','周怡君'];
    let state=JSON.parse(localStorage.getItem(KEY)||'null')||{members:defaults.map((name,i)=>({id:Date.now()+i,name,won:false}))}; let rotation=0, spinning=false;
    const $=id=>document.getElementById(id), wheel=$('wheel'),spin=$('spin'),members=$('members'),lines=$('lines');
    const save=()=>localStorage.setItem(KEY,JSON.stringify(state)); const active=()=>state.members.filter(m=>!m.won);
    function render(){ const list=active(), count=list.length; const radius=Math.max(70,Math.min(225,wheel.clientWidth*.35)); wheel.querySelectorAll('.name').forEach(n=>n.remove()); lines.style.setProperty('--slice',(360/Math.max(count,1))+'deg'); wheel.style.background=count?`conic-gradient(${list.map((_,i)=>`${['#d9d4c9','#d5d8d7','#b9c8d1','#b9c4b3','#d3bdad','#d6c1c1'][i%6]} ${(i*360/count)}deg ${((i+1)*360/count)}deg`).join(',')})`:'#e4e3df'; list.forEach((m,i)=>{let el=document.createElement('div'), angle=i*360/count+180/count;el.className='name';el.style.setProperty('--a',`${angle}deg`);el.style.setProperty('--na',`${-angle}deg`);el.style.setProperty('--radius',`${-radius}px`);el.textContent=m.name;wheel.append(el)}); $('remaining').textContent=count; $('empty').hidden=!!count; spin.disabled=!count||spinning; renderMembers(); }
    function renderMembers(){members.innerHTML='';state.members.forEach(m=>{let li=document.createElement('li');li.innerHTML=`<span class="member-name">${escapeHtml(m.name)}</span>${m.won?'<span class="status">已抽中</span>':''}<button class="mini edit" aria-label="編輯 ${escapeHtml(m.name)}">編輯</button><button class="mini delete" aria-label="刪除 ${escapeHtml(m.name)}">刪除</button>`;li.querySelector('.edit').onclick=()=>edit(m);li.querySelector('.delete').onclick=()=>{if(confirm(`確定刪除「${m.name}」？`)){state.members=state.members.filter(x=>x.id!==m.id);save();render()}};members.append(li)}); }
    const escapeHtml=s=>s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    function edit(m){let name=prompt('修改成員姓名',m.name);if(name!==null&&(name=name.trim())){m.name=name.slice(0,24);save();render()}}
    $('memberForm').onsubmit=e=>{e.preventDefault();let name=$('newName').value.trim();if(!name)return;state.members.push({id:Date.now(),name:name.slice(0,24),won:false});$('newName').value='';save();render()};
    $('manage').onclick=()=>{$('sheet').classList.add('open');$('sheet').setAttribute('aria-hidden','false');$('newName').focus()}; $('close').onclick=closeSheet; $('sheet').onclick=e=>{if(e.target===$('sheet'))closeSheet()}; function closeSheet(){$('sheet').classList.remove('open');$('sheet').setAttribute('aria-hidden','true')}
    $('reset').onclick=()=>{$('confirm').classList.add('show')}; $('cancelReset').onclick=()=>{$('confirm').classList.remove('show')}; $('confirm').onclick=e=>{if(e.target===$('confirm'))$('confirm').classList.remove('show')}; $('confirmReset').onclick=()=>{state.members.forEach(m=>m.won=false);rotation=0;wheel.style.transition='none';wheel.style.transform='rotate(0deg)';spin.textContent='開始';save();render();$('confirm').classList.remove('show');closeSheet();$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1800)};
    let audioCtx, master; function audio(){if(!audioCtx){audioCtx=new (window.AudioContext||window.webkitAudioContext)();master=audioCtx.createGain();master.gain.value=.7;master.connect(audioCtx.destination)}audioCtx.resume();return audioCtx}
    function tone(freq,duration,type='sine',gain=.16,delay=0){try{let ctx=audio(),o=ctx.createOscillator(),g=ctx.createGain(),start=ctx.currentTime+delay;o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(.001,start);g.gain.exponentialRampToValueAtTime(gain,start+.012);g.gain.exponentialRampToValueAtTime(.001,start+duration);o.connect(g).connect(master);o.start(start);o.stop(start+duration+.03)}catch(_){}}
    function suspense(){tone(210,.35,'triangle',.055);tone(255,.45,'triangle',.045,.42);for(let i=0;i<9;i++)setTimeout(()=>tone(330+i*18,.065,'square',.055),1500+i*145)} function celebrate(){[523,659,784,1047].forEach((f,i)=>tone(f,.55,'sine',.15,i*.1));}
    spin.onclick=()=>{if(spinning||!active().length)return;spinning=true;spin.disabled=true;spin.classList.remove('spin-bounce');void spin.offsetWidth;spin.classList.add('spin-bounce');let list=active(),pick=Math.floor(Math.random()*list.length), winner=list[pick], slice=360/list.length, target=-(pick*slice+slice/2), turns=5+Math.floor(Math.random()*2);rotation+=turns*360+((target-(rotation%360)+360)%360);wheel.style.transition='transform 3s cubic-bezier(.08,.74,.14,1)';wheel.style.transform=`rotate(${rotation}deg)`;suspense();setTimeout(()=>{winner.won=true;save();spin.textContent=winner.name;celebrate();confetti();$('winnerName').textContent=winner.name;$('winner').classList.add('show');spinning=false;render()},3050)};
    function confetti(){let c=$('confetti');c.innerHTML='';for(let i=0;i<42;i++){let p=document.createElement('i');p.style.setProperty('--x',Math.random()*100+'%');p.style.setProperty('--r',Math.random()*360+'deg');p.style.setProperty('--c',['#9ba2a7','#c6b9aa','#aebbc4','#c4c4bf'][i%4]);p.style.setProperty('--d',1.3+Math.random()*1.2+'s');p.style.setProperty('--delay',Math.random()*.25+'s');p.style.setProperty('--drift',(Math.random()-.5)*180+'px');c.append(p)}setTimeout(()=>c.innerHTML='',2900)} $('again').onclick=()=>{$('winner').classList.remove('show');spin.textContent='開始';render()};
    render();
  </script>
</body></html>
