<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>成功轉盤</title>
  <style>
    :root { --ink:#fff9ea; --gold:#ffd66b; --violet:#612d97; --panel:rgba(23,12,56,.62); }
    * { box-sizing:border-box } body { margin:0; min-height:100svh; overflow-x:hidden; color:var(--ink); font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif; background:radial-gradient(circle at 50% 18%,#67419d 0,#201043 41%,#100724 100%); }
    body:before, body:after { content:""; position:fixed; z-index:-1; border-radius:50%; filter:blur(2px); opacity:.65; }
    body:before { width:35vmax;height:35vmax;right:-16vmax;top:-15vmax;background:#e64c99 } body:after { width:30vmax;height:30vmax;left:-18vmax;bottom:-16vmax;background:#167ca7 }
    .app { min-height:100svh; display:grid; grid-template-rows:auto 1fr auto; padding:clamp(14px,3vw,30px); }
    header { display:flex; justify-content:space-between; align-items:center; max-width:860px; width:100%; margin:auto; }
    h1 { font-size:clamp(1.15rem,4vw,1.65rem); margin:0; letter-spacing:.11em; text-shadow:0 2px 16px #f4b3ff70; }
    .manage { border:1px solid #ffffff4c; color:var(--ink); background:#ffffff1a; border-radius:999px; min-width:48px; min-height:48px; padding:0 15px; font:inherit; cursor:pointer; backdrop-filter:blur(12px); }
    main { display:grid; place-items:center; padding:12px 0; }
    .stage { width:min(88vw,660px); aspect-ratio:1; position:relative; display:grid; place-items:center; }
    .pointer { position:absolute; z-index:5; top:-1.5%; left:50%; transform:translateX(-50%); width:0;height:0;border-left:19px solid transparent;border-right:19px solid transparent;border-top:42px solid var(--gold); filter:drop-shadow(0 4px 4px #18082d); }
    .pointer:after { content:""; position:absolute;width:12px;height:12px;border-radius:50%;background:#fff6d4;top:-37px;left:-6px; }
    .wheel-shell { width:100%; height:100%; padding:clamp(7px,1.6vw,13px); border-radius:50%; background:linear-gradient(135deg,#fff2a8,#ad6717 45%,#fff2a8 63%,#7c3c0b); box-shadow:0 18px 42px #09011485, inset 0 0 0 2px #fff9cc; }
    .wheel { width:100%;height:100%;border-radius:50%;position:relative;overflow:hidden; transform:rotate(0deg); background:#59378b; box-shadow:inset 0 0 0 3px #260b57; will-change:transform; }
    .slice-lines { position:absolute;inset:0;border-radius:50%;background:repeating-conic-gradient(from 0deg,transparent 0 calc(var(--slice) - 1deg),#fff7d477 calc(var(--slice) - .2deg) var(--slice)); pointer-events:none; }
    .name { --a:0deg; --na:0deg; --radius:-120px; position:absolute; left:50%; top:50%; width:34%; text-align:center; font-weight:900; letter-spacing:.04em; font-size:clamp(.78rem,2.8vw,1.3rem); line-height:1.1; color:#fffdf3; text-shadow:0 2px 3px #250d4a,0 0 8px #250d4a; transform:translate(-50%,-50%) rotate(var(--a)) translateY(var(--radius)) rotate(var(--na)); transform-origin:center; overflow-wrap:anywhere; }
    .center-button { z-index:4; position:absolute; display:grid; place-items:center; width:28%; aspect-ratio:1; border-radius:50%; border:5px solid #fff1b6; background:radial-gradient(circle at 30% 25%,#ffed9d,#e48d24 68%,#a74b08); color:#3c165d; font-size:clamp(1rem,4.5vw,1.65rem); font-weight:900; letter-spacing:.12em; box-shadow:0 7px 0 #6e2f11,0 11px 22px #21052d85; cursor:pointer; transition:transform .15s,filter .2s; }
    .center-button:active { transform:translateY(5px); box-shadow:0 2px 0 #6e2f11,0 5px 14px #21052d85; } .center-button:disabled { cursor:wait; filter:grayscale(.2); }
    .empty { position:absolute; z-index:6; text-align:center; font-weight:700; background:#1d0a3ecc; padding:20px; border-radius:18px; }
    footer { text-align:center; font-size:.9rem; color:#fff4c3c9; min-height:25px; } #remaining { color:var(--gold);font-weight:bold; }
    .sheet { position:fixed;inset:0;z-index:20;display:none;align-items:end;justify-content:center;background:#08031b88;backdrop-filter:blur(5px); } .sheet.open{display:flex}
    .sheet-panel { width:min(100%,560px); max-height:85svh; overflow:auto; padding:22px max(20px,env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left)); border-radius:28px 28px 0 0; background:linear-gradient(145deg,#31155e,#150a36); box-shadow:0 -8px 32px #0700129a; }
    .sheet-top { display:flex;justify-content:space-between;align-items:center; } h2{margin:0;font-size:1.3rem}.close{background:none;border:0;color:white;font-size:2rem;line-height:1;cursor:pointer;padding:7px}
    form { display:flex;gap:9px;margin:20px 0 14px; } input { min-width:0; flex:1; font:inherit; color:#2a124d;border:0;border-radius:12px;padding:15px; } .add { border:0;border-radius:12px;background:var(--gold);color:#3d1c66;font:inherit;font-weight:900;padding:0 16px;cursor:pointer; }
    .members { list-style:none;margin:0;padding:0;display:grid;gap:8px }.members li { display:flex;align-items:center;gap:8px;padding:10px 10px 10px 15px;border:1px solid #ffffff26;border-radius:14px;background:#ffffff0d; }.member-name{flex:1;font-weight:600;overflow-wrap:anywhere}.mini { min-width:42px;min-height:42px;border:0;border-radius:10px;background:#ffffff1a;color:white;font:inherit;cursor:pointer}.mini.delete{color:#ffacbc}.status{font-size:.82rem;color:#ffdc76}.winner { position:fixed;z-index:15;inset:0;display:none;place-items:center;text-align:center;background:radial-gradient(circle,#641f9999,#100321d9 65%);backdrop-filter:blur(3px); }.winner.show{display:grid;animation:fade .25s}.winner-card{padding:36px 22px;max-width:min(88vw,550px);animation:pop .6s cubic-bezier(.2,1.4,.3,1)}.winner-card small{font-size:1.2rem;letter-spacing:.2em;color:#ffe58d}.winner-name{font-size:clamp(2.8rem,13vw,6rem);font-weight:900;line-height:1.12;margin:10px 0 26px;text-shadow:0 4px 0 #4a146d,0 0 22px #ffda6b}.again{border:0;border-radius:999px;padding:16px 28px;font:inherit;font-size:1.1rem;font-weight:900;color:#4a176d;background:#fff1a3;cursor:pointer}.confetti{position:fixed;inset:0;pointer-events:none;z-index:16;overflow:hidden}.confetti i{position:absolute;width:10px;height:17px;background:var(--c);left:var(--x);top:-30px;transform:rotate(var(--r));animation:fall var(--d) var(--delay) ease-in forwards}@keyframes fall{to{top:110%;transform:translateX(var(--drift)) rotate(720deg)}}@keyframes pop{from{transform:scale(.35);opacity:0}to{transform:scale(1);opacity:1}}@keyframes fade{from{opacity:0}to{opacity:1}}
    @media (min-width:700px){.stage{width:min(70vh,620px)}.sheet{align-items:center}.sheet-panel{border-radius:24px}.app{padding-bottom:18px}}
  </style>
</head>
<body>
  <div class="app"><header><h1>成功轉盤</h1><button class="manage" id="manage" aria-label="管理成員">☰ 名單</button></header><main><div class="stage"><div class="pointer"></div><div class="wheel-shell"><div class="wheel" id="wheel"><div class="slice-lines" id="lines"></div></div></div><button class="center-button" id="spin">開始</button><div class="empty" id="empty" hidden>名單已抽完<br><small>到「名單」新增成員</small></div></div></main><footer>剩餘 <span id="remaining">0</span> 位成員</footer></div>
  <div class="sheet" id="sheet" aria-hidden="true"><section class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="membersTitle"><div class="sheet-top"><h2 id="membersTitle">成員名單</h2><button class="close" id="close" aria-label="關閉">×</button></div><form id="memberForm"><input id="newName" maxlength="24" placeholder="輸入成員姓名" autocomplete="off" required><button class="add">新增</button></form><ul class="members" id="members"></ul></section></div>
  <div class="winner" id="winner"><div class="winner-card"><small>✦ 恭喜抽中 ✦</small><div class="winner-name" id="winnerName"></div><button class="again" id="again">太棒了！繼續抽</button></div></div><div class="confetti" id="confetti"></div>
  <script>
    const KEY='success-wheel-demo-v1';
    const defaults=['王小明','陳小美','林志豪','張雅婷','李承翰','周怡君'];
    let state=JSON.parse(localStorage.getItem(KEY)||'null')||{members:defaults.map((name,i)=>({id:Date.now()+i,name,won:false}))}; let rotation=0, spinning=false;
    const $=id=>document.getElementById(id), wheel=$('wheel'),spin=$('spin'),members=$('members'),lines=$('lines');
    const save=()=>localStorage.setItem(KEY,JSON.stringify(state)); const active=()=>state.members.filter(m=>!m.won);
    function render(){ const list=active(), count=list.length; const radius=Math.max(70,Math.min(225,wheel.clientWidth*.35)); wheel.querySelectorAll('.name').forEach(n=>n.remove()); lines.style.setProperty('--slice',(360/Math.max(count,1))+'deg'); wheel.style.background=count?`conic-gradient(${list.map((_,i)=>`${['#7c3db2','#236fa2','#b84378','#288d85','#db8037','#4c5db5'][i%6]} ${(i*360/count)}deg ${((i+1)*360/count)}deg`).join(',')})`:'#4a2e6e'; list.forEach((m,i)=>{let el=document.createElement('div'), angle=i*360/count+180/count;el.className='name';el.style.setProperty('--a',`${angle}deg`);el.style.setProperty('--na',`${-angle}deg`);el.style.setProperty('--radius',`${-radius}px`);el.textContent=m.name;wheel.append(el)}); $('remaining').textContent=count; $('empty').hidden=!!count; spin.disabled=!count||spinning; renderMembers(); }
    function renderMembers(){members.innerHTML='';state.members.forEach(m=>{let li=document.createElement('li');li.innerHTML=`<span class="member-name">${escapeHtml(m.name)}</span>${m.won?'<span class="status">已抽中</span>':''}<button class="mini edit" aria-label="編輯 ${escapeHtml(m.name)}">編輯</button><button class="mini delete" aria-label="刪除 ${escapeHtml(m.name)}">刪除</button>`;li.querySelector('.edit').onclick=()=>edit(m);li.querySelector('.delete').onclick=()=>{if(confirm(`確定刪除「${m.name}」？`)){state.members=state.members.filter(x=>x.id!==m.id);save();render()}};members.append(li)}); }
    const escapeHtml=s=>s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    function edit(m){let name=prompt('修改成員姓名',m.name);if(name!==null&&(name=name.trim())){m.name=name.slice(0,24);save();render()}}
    $('memberForm').onsubmit=e=>{e.preventDefault();let name=$('newName').value.trim();if(!name)return;state.members.push({id:Date.now(),name:name.slice(0,24),won:false});$('newName').value='';save();render()};
    $('manage').onclick=()=>{$('sheet').classList.add('open');$('sheet').setAttribute('aria-hidden','false');$('newName').focus()}; $('close').onclick=closeSheet; $('sheet').onclick=e=>{if(e.target===$('sheet'))closeSheet()}; function closeSheet(){$('sheet').classList.remove('open');$('sheet').setAttribute('aria-hidden','true')}
    let audioCtx, master; function audio(){if(!audioCtx){audioCtx=new (window.AudioContext||window.webkitAudioContext)();master=audioCtx.createGain();master.gain.value=.7;master.connect(audioCtx.destination)}audioCtx.resume();return audioCtx}
    function tone(freq,duration,type='sine',gain=.16,delay=0){try{let ctx=audio(),o=ctx.createOscillator(),g=ctx.createGain(),start=ctx.currentTime+delay;o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(.001,start);g.gain.exponentialRampToValueAtTime(gain,start+.012);g.gain.exponentialRampToValueAtTime(.001,start+duration);o.connect(g).connect(master);o.start(start);o.stop(start+duration+.03)}catch(_){}}
    function suspense(){for(let i=0;i<19;i++)setTimeout(()=>tone(165+i*14,.075,'square',.09),i*250)} function celebrate(){[523,659,784,1047].forEach((f,i)=>tone(f,.75,'sine',.21,i*.11));}
    spin.onclick=()=>{if(spinning||!active().length)return;spinning=true;spin.disabled=true;spin.textContent='';let list=active(),pick=Math.floor(Math.random()*list.length), winner=list[pick], slice=360/list.length, target=-(pick*slice+slice/2), turns=7+Math.floor(Math.random()*3);rotation+=turns*360+((target-(rotation%360)+360)%360);wheel.style.transition='transform 5.6s cubic-bezier(.08,.72,.1,1)';wheel.style.transform=`rotate(${rotation}deg)`;suspense();setTimeout(()=>{winner.won=true;save();spin.textContent=winner.name;celebrate();confetti();$('winnerName').textContent=winner.name;$('winner').classList.add('show');spinning=false;render()},5650)};
    function confetti(){let c=$('confetti');c.innerHTML='';for(let i=0;i<105;i++){let p=document.createElement('i');p.style.setProperty('--x',Math.random()*100+'%');p.style.setProperty('--r',Math.random()*360+'deg');p.style.setProperty('--c',['#ffe272','#ff629b','#64dcff','#9affad','#fff'][i%5]);p.style.setProperty('--d',1.8+Math.random()*1.8+'s');p.style.setProperty('--delay',Math.random()*.55+'s');p.style.setProperty('--drift',(Math.random()-.5)*260+'px');c.append(p)}setTimeout(()=>c.innerHTML='',4500)} $('again').onclick=()=>{$('winner').classList.remove('show');spin.textContent='開始';render()};
    render();
  </script>
</body></html>
